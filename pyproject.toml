[project]
name = "finance-copilot"
version = "0.1.0"
description = ""
authors = [
    {name = "williamfohara", email = "billlyoharaa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "openai (>=1.93.3,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "intuit-oauth (>=1.2.6,<2.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "duckdb (>=1.3.2,<2.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "dbt-core (>=1.10.3,<2.0.0)",
    "dbt-duckdb (>=1.9.4,<2.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "langchain (>=0.3.26,<0.4.0)",
    "langchain-community (>=0.3.27,<0.4.0)",
    "duckdb-engine (>=0.17.0,<0.18.0)",
    "langchain-openai (>=0.3.27,<0.4.0)",
    "fastapi (>=0.116.0,<0.117.0)",
    "streamlit (>=1.46.1,<2.0.0)",
    "langchain-experimental (>=0.3.4,<0.4.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
black = "^25.1.0"
flake8 = "^7.3.0"
isort = "^6.0.1"
sqlfluff = "^3.4.1"

[tool.black]
line-length = 100
